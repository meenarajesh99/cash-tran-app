# datasource connection properties
spring.datasource.url=${NEON_DB_URL}
spring.datasource.name=cashtran
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# Server
# =========================================================
server.port=${PORT:8080}
server.address=0.0.0.0

cashtran.frontend.url=${CASHTRAN_FRONTEND_URL}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.header=Authorization
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.expiration=604800
jwt.token-validity-in-seconds=86400
jwt.token-validity-in-seconds-for-remember-me=108000
jwt.route.authentication.path=/login
jwt.route.authentication.refresh=/refresh

server.error.include-message=always
server.error.include-stacktrace=always

# email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.test-connection=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.roles=
management.health.mail.enabled=false

#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
