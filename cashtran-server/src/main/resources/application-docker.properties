# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Server
server.port=${SERVER_PORT:8080}
server.compression.enabled=true

# JWT
jwt.header=Authorization
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.token-validity-in-seconds=${JWT_EXPIRATION:86400}
jwt.token-validity-in-seconds-for-remember-me=${JWT_REMEMBER_ME_EXPIRATION:604800}
jwt.route.authentication.path=/login
jwt.route.authentication.refresh=/refresh

# Swagger / springdoc
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.root=WARN
logging.level.com.perscholas=INFO
logging.pattern.console=%d{ISO8601} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized